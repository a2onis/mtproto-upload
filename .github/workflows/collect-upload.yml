name: Collect and upload MTProto proxies

on:
  push:
    branches:
      - main
      - "arena/**"
    paths:
      - ".github/workflows/collect-upload.yml"
      - "fetch_and_upload.py"
      - "requirements.txt"
      - "tests/**"
  schedule:
    # 06:00 and 18:00 Asia/Tehran (UTC+03:30), year-round.
    - cron: "30 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHANNEL_IDS: ${{ vars.CHANNEL_IDS || secrets.CHANNEL_IDS }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      # public = anonymous uploadkon.ir endpoint (default), drive = my.uploadkon.ir
      # account API, auto = try public first and fall back to drive when a cookie exists.
      UPLOADKON_MODE: ${{ vars.UPLOADKON_MODE || 'auto' }}
      UPLOADKON_PUBLIC_URL: ${{ vars.UPLOADKON_PUBLIC_URL }}
      UPLOADKON_COOKIE: ${{ secrets.UPLOADKON_COOKIE }}
      UPLOADKON_XSRF_TOKEN: ${{ secrets.UPLOADKON_XSRF_TOKEN }}
      UPLOADKON_URL: ${{ vars.UPLOADKON_URL }}
      UPLOADKON_BACKEND_ID: ${{ vars.UPLOADKON_BACKEND_ID }}
      UPLOADKON_PARENT_ID: ${{ vars.UPLOADKON_PARENT_ID }}
      UPLOADKON_WORKSPACE_ID: ${{ vars.UPLOADKON_WORKSPACE_ID }}
      UPLOADKON_UPLOAD_TYPE: ${{ vars.UPLOADKON_UPLOAD_TYPE }}
      LOOKBACK_HOURS: "12"
      # Retry transient UploadKon failures (timeouts, 5xx, expired session) before failing.
      UPLOADKON_MAX_ATTEMPTS: ${{ vars.UPLOADKON_MAX_ATTEMPTS || '4' }}
      UPLOADKON_TIMEOUT: ${{ vars.UPLOADKON_TIMEOUT || '120' }}
      UPLOADKON_TOTAL_TIMEOUT: ${{ vars.UPLOADKON_TOTAL_TIMEOUT || '600' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate required secrets
        run: |
          test -n "$CHANNEL_IDS" || { echo 'Missing CHANNEL_IDS repository variable or secret'; exit 1; }
          if [ "$UPLOADKON_MODE" = "drive" ]; then
            test -n "$UPLOADKON_COOKIE" || { echo 'UPLOADKON_MODE=drive requires the UPLOADKON_COOKIE secret'; exit 1; }
          fi
      - name: Collect and upload
        run: python fetch_and_upload.py
      - name: Upload proxy list artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mtproto-proxies
          path: mtproto-proxies-*.txt
          if-no-files-found: ignore
