name: UploadKon connectivity probe (temporary)

on:
  push:
    paths:
      - ".github/workflows/upload-debug.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install --disable-pip-version-check "requests>=2.32,<3"
      - name: Probe upload endpoints
        env:
          UPLOADKON_COOKIE: ${{ secrets.UPLOADKON_COOKIE }}
          UPLOADKON_XSRF_TOKEN: ${{ secrets.UPLOADKON_XSRF_TOKEN }}
        run: |
          python - <<'PY'
          import io, json, os, socket, time, zipfile
          import requests

          UA = ("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36")
          lines = []

          def log(message):
              lines.append(str(message).replace("\n", " "))
              print(message)

          def summarize(response, elapsed, body=True):
              parts = [f"HTTP {response.status_code} in {elapsed:.2f}s",
                       f"ct={response.headers.get('Content-Type')}"]
              if body:
                  parts.append("body=" + response.text[:400].replace("\n", " "))
              return " | ".join(parts)

          def probe(label, session, method, url, **kwargs):
              started = time.time()
              try:
                  response = getattr(session, method)(url, timeout=(20, 90), **kwargs)
                  log(f"[{label}] {summarize(response, time.time() - started)}")
                  return response
              except Exception as exc:
                  log(f"[{label}] FAILED after {time.time() - started:.2f}s: "
                      f"{type(exc).__name__}: {exc}")
                  return None

          def public_upload(name, data, mime="text/plain"):
              session = requests.Session()
              headers = {"User-Agent": UA, "Accept": "*/*",
                         "Accept-Language": "en-US,en;q=0.9",
                         "X-Requested-With": "XMLHttpRequest",
                         "Origin": "https://uploadkon.ir",
                         "Referer": "https://uploadkon.ir/",
                         "Connection": "close"}
              return probe(f"public POST {name}", session, "post",
                           "https://uploadkon.ir/", headers=headers,
                           data={"submitr": "1", "ajax": "1"},
                           files={"file": (name, data, mime)})

          log("DNS uploadkon.ir: " + str(socket.gethostbyname_ex("uploadkon.ir")))
          log("DNS my.uploadkon.ir: " + str(socket.gethostbyname_ex("my.uploadkon.ir")))

          page = requests.Session()
          probe("GET uploadkon.ir", page, "get", "https://uploadkon.ir/",
                headers={"User-Agent": UA, "Accept": "text/html"}, allow_redirects=True)

          payload = b"tg://proxy?server=probe.example&port=443&secret=deadbeef\n"
          # Which extensions does the anonymous uploader accept?
          for name in ("probe.log", "probe.csv", "probe.json", "probe.dat",
                       "probe.txt.zip", "probe.txt"):
              if name.endswith(".zip"):
                  buffer = io.BytesIO()
                  with zipfile.ZipFile(buffer, "w", zipfile.ZIP_DEFLATED) as archive:
                      archive.writestr("probe.txt", payload)
                  data = buffer.getvalue()
                  mime = "application/zip"
              else:
                  data = payload
                  mime = "text/plain"
              public_upload(name, data, mime)

          cookie = (os.getenv("UPLOADKON_COOKIE") or "").strip()
          xsrf = (os.getenv("UPLOADKON_XSRF_TOKEN") or "").strip()
          if cookie:
              base = {"User-Agent": UA, "Accept": "application/json",
                      "X-Requested-With": "XMLHttpRequest",
                      "Origin": "https://my.uploadkon.ir",
                      "Referer": "https://my.uploadkon.ir/drive"}
              probe("GET my drive", requests.Session(), "get",
                    "https://my.uploadkon.ir/api/v1/drive/file-entries",
                    headers={**base, "Cookie": cookie}, params={"perPage": 1})
              drive = requests.Session()
              probe("POST my upload (txt)", drive, "post",
                    "https://my.uploadkon.ir/api/v1/file-entries",
                    headers={**base, "Cookie": cookie, "X-XSRF-TOKEN": xsrf,
                             "Connection": "close"},
                    data={"clientMime": "text/plain", "clientExtension": "txt",
                          "uploadType": "bedrive", "backendId": "cdc_W8Ekm8",
                          "parentId": "", "workspaceId": "0", "relativePath": ""},
                    files={"file": ("probe-drive.txt", payload, "text/plain")})
          else:
              log("No UPLOADKON_COOKIE secret; skipping the drive API probes.")

          # One aggregated annotation keeps us under GitHub's 10-per-step limit.
          print("::notice::PROBE_RESULT " + json.dumps(lines)[:12000])
          PY
